name: setup-www

description: |
  Deploys the Unikraft OSS documentation site (oss-www).

inputs:
  environment:
    required: true
    description: The environment to use.
  name:
    required: true
    description: Name of the service.
  domain:
    required: false
    description: The domain to use for the deployment.
  memory:
    required: false
    description: Set the memory size.
    default: 1536M
  port:
    required: false
    description: The port the service listens on.
    default: "3000"

outputs:
  domain:
    description: |
      Either the input domain if set or the automatically generated value
      otherwise.
    value: ${{ steps.service.outputs.domain }}

runs:
  using: composite
  steps:
  - name: Create Deployment
    uses: bobheadxi/deployments@v1
    id: init-deploy
    with:
      step: start
      token: ${{ github.token }}
      env: ${{ inputs.environment }}

  - name: Create Service Group
    id: service
    shell: bash
    run: |
      set -e;

      # Create the service if it does not exist.
      if ! unikraft service get "${{ inputs.name }}" -o quiet 2>/dev/null; then
        unikraft service create \
          --domains "${{ inputs.domain || inputs.name }}" \
          --name "${{ inputs.name }}" \
          --services "443:${{ inputs.port }}/http+tls" \
        ;
      fi

      # Save the generated domain as an output variable
      echo "domain=$(unikraft service get ${{ inputs.name }} -o json | jq -r '.[0].domains[0].fqdn')" >> $GITHUB_OUTPUT

  - name: Deploy
    id: deploy
    shell: bash
    run: |
      unikraft build \
        --output "oci://internal/${{ inputs.name }}:latest" \
        .;

      # Remove any existing instance(s) on this service before running the
      # new one, so the service always ends up with just the latest build.
      unikraft instance delete \
        --filter "service.name==${{ inputs.name }}" \
        --force \
        2>/dev/null || true;

      unikraft run \
        --autostart \
        --restart always \
        --memory "${{ inputs.memory }}" \
        --service "${{ inputs.name }}" \
        --image "internal/${{ inputs.name }}:latest" \
        ;

  - name: Test liveliness
    id: liveliness
    continue-on-error: true
    shell: bash
    run: |
      sleep 15;
      curl -Lk --fail "https://${{ steps.service.outputs.domain }}/"

  - name: Dump instance logs on failure
    if: ${{ steps.liveliness.outcome == 'failure' }}
    shell: bash
    run: |
      _INST=$(unikraft service get "${{ inputs.name }}" -o json | jq -r '.[0].instances[0].name')
      unikraft instance logs "${_INST}"
      exit 1

  - name: Update Deployment
    uses: bobheadxi/deployments@v1
    with:
      step: finish
      token: ${{ github.token }}
      env: ${{ inputs.environment }}
      deployment_id: ${{ steps.init-deploy.outputs.deployment_id }}
      status: ${{ job.status }}
